<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Мои оценки - 1 четверть</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body{
  background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
  min-height: 100vh;
  padding: 20px;
  font-family: 'Nunito', sans-serif;
  color: #4c1d95;
  display: flex;
  justify-content: center;
}

.diary-container {
  max-width: 700px;
  width: 100%;
  background: #ffffff;
  border: 3px solid #a855f7;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
  position: relative;
  overflow: hidden;
  background-image: 
    radial-gradient(circle at 10% 10%, #f3e8ff 0%, transparent 30%),
    radial-gradient(circle at 90% 90%, #f3e8ff 0%, transparent 40%);
}

/* Заголовки */
.main-title {
  font-family: 'Caveat', cursive;
  font-size: 3.5rem;
  color: #4c1d95;
  text-align: center;
  margin-bottom: 20px;
  transform: rotate(-2deg);
  text-shadow: 2px 2px 0px #ddd6fe;
}

.section-title {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  background: linear-gradient(90deg, #ddd6fe, #c4b5fd);
  display: inline-block;
  padding: 5px 20px;
  border-radius: 20px;
  color: #4c1d95;
  margin: 10px 0 15px 10px;
  transform: rotate(-1deg);
  box-shadow: 2px 3px 0px #a855f7;
}

/* Таблицы */
table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255,255,255,0.8);
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #a855f7;
  margin-bottom: 20px;
}

th, td {
  border: 1px solid #d8b4fe;
  padding: 12px;
  text-align: center;
  font-size: 1.1rem;
}

th {
  background: #e9d5ff;
  font-weight: 700;
  color: #4c1d95;
}

td:first-child, th:first-child {
  text-align: left;
  font-weight: 600;
  padding-left: 15px;
  width: 60%;
}

/* Стили для готовых оценок */
.grade {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 1.4rem;
  font-weight: 700;
  color: white;
  box-shadow: 0 3px 0 rgba(0,0,0,0.15);
}

.grade-5 { background: #9333ea; } /* Пятерки */
.grade-4 { background: #c084fc; } /* Четверки */

/* Декор */
.decorations {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 40px;
  pointer-events: none;
}

.books, .pencils {
  font-size: 3rem;
  opacity: 0.8;
  filter: drop-shadow(2px 4px 6px rgba(168, 85, 247, 0.3));
}

@media (max-width: 500px) {
  .diary-container { padding: 15px; }
  .main-title { font-size: 2.5rem; }
  td:first-child, th:first-child { width: 65%; }
  .grade { width: 36px; height: 36px; font-size: 1.1rem; }
  th, td { padding: 8px 4px; font-size: 1rem; }
}
</style>
</head>
<body>

<div class="diary-container">
  <h1 class="main-title">Мои оценки</h1>

  <div class="section-title">1 четверть</div>
  
  <table>
    <thead>
      <tr>
        <th>Предмет</th>
        <th>Оценка</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Литература</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Русский</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Алгебра</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Геометрия</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Вероятность</td><td><span class="grade grade-5">5</span></td></tr>
      <tr><td>Физра</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Общество</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>История</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>ОБЗР</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Немецкий</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Информатика</td><td><span class="grade grade-5">5</span></td></tr>
      <tr><td>География</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Труд</td><td><span class="grade grade-5">5</span></td></tr>
      <tr><td>Биология</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Химия</td><td><span class="grade grade-4">4</span></td></tr>
      <tr><td>Физика</td><td><span class="grade grade-4">4</span></td></tr>
    </tbody>
  </table>

  <div class="decorations">
    <div class="books">📚</div>
    <div class="pencils">✏️✒️📏</div>
  </div>
</div>

</body>
</html>
