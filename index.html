<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Мои оценки - 1 четверть</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body{
  background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
  min-height: 100vh;
  padding: 20px;
  font-family: 'Nunito', sans-serif;
  color: #4c1d95;
  display: flex;
  justify-content: center;
}

.diary-container {
  max-width: 700px;
  width: 100%;
  background: #ffffff;
  border: 3px solid #a855f7;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
  position: relative;
  overflow: hidden;
  background-image: 
    radial-gradient(circle at 10% 10%, #f3e8ff 0%, transparent 30%),
    radial-gradient(circle at 90% 90%, #f3e8ff 0%, transparent 40%);
}

/* Заголовки */
.main-title {
  font-family: 'Caveat', cursive;
  font-size: 3.5rem;
  color: #4c1d95;
  text-align: center;
  margin-bottom: 20px;
  transform: rotate(-2deg);
  text-shadow: 2px 2px 0px #ddd6fe;
}

.section-title {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  background: linear-gradient(90deg, #ddd6fe, #c4b5fd);
  display: inline-block;
  padding: 5px 20px;
  border-radius: 20px;
  color: #4c1d95;
  margin: 10px 0 15px 10px;
  transform: rotate(-1deg);
  box-shadow: 2px 3px 0px #a855f7;
}

/* Таблицы */
table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255,255,255,0.8);
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #a855f7;
  margin-bottom: 20px;
}

th, td {
  border: 1px solid #d8b4fe;
  padding: 12px;
  text-align: center;
  font-size: 1.1rem;
}

th {
  background: #e9d5ff;
  font-weight: 700;
  color: #4c1d95;
}

td:first-child, th:first-child {
  text-align: left;
  font-weight: 600;
  padding-left: 15px;
  width: 60%;
}

/* Инпуты внутри таблицы */
input[type="number"] {
  width: 100%;
  max-width: 80px;
  padding: 8px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: transparent;
  text-align: center;
  font-family: 'Nunito', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: #6b21a8;
  outline: none;
  transition: all 0.2s;
}

input[type="number"]:focus {
  background: #fff;
  border-color: #a855f7;
  box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Кнопки */
footer {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 30px;
}

button {
  background: #a855f7;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 4px 0 #7e22ce;
  transition: transform 0.1s, box-shadow 0.1s;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #7e22ce;
}

button:hover {
  background: #9333ea;
}

/* Декор */
.decorations {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 40px;
  pointer-events: none;
}

.books, .pencils {
  font-size: 3rem;
  opacity: 0.8;
  filter: drop-shadow(2px 4px 6px rgba(168, 85, 247, 0.3));
}

@media (max-width: 500px) {
  .diary-container { padding: 15px; }
  .main-title { font-size: 2.5rem; }
  td:first-child, th:first-child { width: 65%; }
  input[type="number"] { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="diary-container">
  <h1 class="main-title">Мои оценки</h1>

  <div class="section-title">1 четверть</div>
  <table id="gradesTable">
    <thead>
      <tr>
        <th>Предмет</th>
        <th>Оценка</th>
      </tr>
    </thead>
    <tbody>
      <!-- Заполняется через JS -->
    </tbody>
  </table>

  <footer>
    <button id="saveBtn">💾 Сохранить</button>
    <button id="clearBtn">🗑️ Сбросить</button>
  </footer>

  <div class="decorations">
    <div class="books">📚</div>
    <div class="pencils">✏️✒️📏</div>
  </div>
</div>

<script>
// Список предметов
const SUBJECTS = [
  'Литература', 'Русский', 'Алгебра', 'Геометрия', 'Вероятность',
  'Физра', 'Общество', 'История', 'ОБЗР', 'Немецкий',
  'Информатика', 'География', 'Труд', 'Биология', 'Химия', 'Физика'
];

// Оценки по умолчанию (как ты просил: везде 4, кроме отдельных предметов - 5)
const DEFAULT_GRADES = {
  'Литература': 4,
  'Русский': 4,
  'Алгебра': 4,
  'Геометрия': 4,
  'Вероятность': 5,
  'Физра': 4,
  'Общество': 4,
  'История': 4,
  'ОБЗР': 5,
  'Немецкий': 4,
  'Информатика': 4,
  'География': 4,
  'Труд': 4,
  'Биология': 4,
  'Химия': 4,
  'Физика': 5
};

const STORAGE_KEY = 'diary_q1_v1';

// Загрузка данных
let data = {};
try {
  data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!data || Object.keys(data).length === 0) {
    data = { ...DEFAULT_GRADES }; // Если пусто, ставим дефолтные
  }
} catch(e) { 
  data = { ...DEFAULT_GRADES }; 
}

// Сохранение
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Отрисовка
function render() {
  const tbody = document.querySelector('#gradesTable tbody');
  tbody.innerHTML = '';

  SUBJECTS.forEach(subject => {
    // Если оценки нет, ставим пустоту
    if (data[subject] === undefined) data[subject] = '';

    const row = document.createElement('tr');
    
    // Ячейка с названием
    const nameCell = document.createElement('td');
    nameCell.textContent = subject;
    row.appendChild(nameCell);

    // Ячейка с инпутом
    const valCell = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'number';
    input.min = 1;
    input.max = 5;
    input.value = data[subject];
    
    input.addEventListener('input', (e) => {
      let val = e.target.value;
      if (val > 5) e.target.value = 5;
      if (val < 1 && val !== '') e.target.value = 1;
      
      data[subject] = e.target.value;
      saveData();
    });

    valCell.appendChild(input);
    row.appendChild(valCell);
    
    tbody.appendChild(row);
  });
}

// Кнопка "Сбросить к оценкам по умолчанию"
document.getElementById('clearBtn').onclick = () => {
  if (confirm('Сбросить все оценки обратно к стандартным (4 и 5)?')) {
    data = { ...DEFAULT_GRADES };
    saveData();
    render();
  }
};

// Кнопка "Сохранить"
document.getElementById('saveBtn').onclick = () => {
  saveData();
  alert('Твои оценки за 1 четверть сохранены!');
};

// Запуск
render();
</script>
</body>
</html>
